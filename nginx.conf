worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Docker's embedded DNS tracks the app address across container replacements.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name zhongkaitech.com.cn;

        ssl_certificate     /etc/nginx/tls/zhongkaitech-web.pem;
        ssl_certificate_key /etc/nginx/tls/zhongkaitech-web.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $backend http://app:80;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
